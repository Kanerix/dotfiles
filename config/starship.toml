"$schema" = 'http://starship.rs/config-schema.json'

add_newline = true

format = "$username:$directory$git_branch$git_metrics$git_status$cmd_duration\n$character"

[username]
format = '[$user]($style)'
style_user = 'bold #ff66d9'
show_always = true


[character] 
success_symbol = '[>](bold green)'
error_symbol = '[>](bold red)'	
vimcmd_symbol = '[<](bold green)'	
vimcmd_replace_one_symbol = '[<](bold purple)'
vimcmd_replace_symbol = '[<](bold purple)'
vimcmd_visual_symbol = '[<](bold yellow)'

[directory]
style = 'bold purple'

[git_branch]
format = '[git:\(](bold green)[$branch]($style)[\)](bold green)'
style = 'bold yellow'

[git_metrics] 
format = '\[[+$added]($added_style),[-$deleted]($deleted_style)\]'
only_nonzero_diffs = false
disabled = false

[git_status]
style = "bold green"

[cmd_duration]
min_time = 4_000
show_notifications = true
min_time_to_notify = 60_000
