# Symlinked to ~/.config/nix/nix.conf by `just link`.
#
# Without this every flake command fails with "experimental Nix feature
# 'nix-command' is disabled". The installer does not enable them, and
# /etc/nix/nix.conf is root-owned, so keeping it here means the setting travels
# with the repo instead of being re-applied by hand on each machine.
#
# extra-experimental-features rather than experimental-features: the extra-
# prefix appends to whatever /etc/nix/nix.conf already sets, where the bare
# setting would replace it.
extra-experimental-features = nix-command flakes
