[general]
import = [
    "~/.config/alacritty/themes/themes/deep-space.toml"
]

[env]
TERM = "xterm-256color"

[window]
padding = { x = 10, y = 10 }
opacity = 0.97
dynamic_padding = true
decorations = "Full"

[font]
size = 18
normal = { family = "RecMonoCasual Nerd Font Mono", style = "Regular" } 
italic = { family = "RecMonoCasual Nerd Font Mono", style = "Regular" }
bold = { family = "RecMonoCasual Nerd Font Mono", style = "Regular" }
bold_italic = { family = "RecMonoCasual Nerd Font Mono", style = "Regular" }

[terminal]
shell = "/opt/homebrew/bin/fish"
